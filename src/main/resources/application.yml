spring:
  application:
    name: audittrove
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_FILE_SIZE:15MB}
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
audittrove:
  max-pdf-bytes: ${MAX_PDF_BYTES:15728640}
  security:
    # Bos birakilirsa mobil auth filtresi pasif kalir (mevcut davranis).
    # Deploy oncesi guclu bir rastgele deger verilmeli: MOBILE_TOKEN_SECRET
    token-secret: ${MOBILE_TOKEN_SECRET:}
    audit-rate-limit-per-hour: ${AUDIT_RATE_LIMIT_PER_HOUR:5}
    # RevenueCat secret API key (sk_...). Bos ise herkes ucretsiz sayilir.
    revenuecat-api-key: ${REVENUECAT_API_KEY:}
    # Aylik kullanim sayaclarinin tutuldugu Postgres. Bos ise kota uygulanmaz.
    usage-database-url: ${USAGE_DATABASE_URL:}
    # Ucretsiz kullanicinin aylik inceleme hakki
    free-monthly-limit: ${FREE_MONTHLY_LIMIT:5}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:90}
  rag:
    result-limit: ${RAG_RESULT_LIMIT:8}
    database:
      url: ${RAG_DATABASE_URL:}
      username: ${RAG_DATABASE_USERNAME:}
      password: ${RAG_DATABASE_PASSWORD:}
      migrate: ${RAG_DATABASE_MIGRATE:true}
logging:
  level:
    root: INFO
    com.audittrove: INFO